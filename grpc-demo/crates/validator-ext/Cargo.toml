[package]
name = "validator-ext"
version = "0.1.0"
edition = "2024"
[lib]
proc-macro = true


[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = { version = "2.0.114", features = ["full"] }
regex = "1.12.2"

[dev-dependencies]
validator = { version = "0.20.0", features = ["derive"] }
trybuild = "1.0"
