[package]
name = "user-server"
version = "0.1.0"
edition = "2024"

[dependencies]
proto = { path = "../../proto" }
prost-types = "0.14.1"
tokio = { version = "1.48.0", features = ["full"] }
tonic = "0.14.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tonic-health = "0.14.2"
tonic-reflection = "0.14.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio",
    "postgres",
    "chrono",
    "uuid"] }
uuid = { version = "1" }
futures = "0.3.31"
async-stream = "0.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.42", features = ["serde"] }
axum = { version = "0.8.8" }
anyhow = "1.0.100"
tower = "0.5.2"
dotenv = "0.15.0"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full", "rt-multi-thread", "macros"] }
