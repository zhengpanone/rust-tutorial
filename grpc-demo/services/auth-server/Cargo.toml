[package]
name = "auth-server"
version = "0.1.0"
edition = "2024"

[dependencies]
proto = { path = "../../proto" }
prost-types = { workspace = true }
tokio = { workspace = true }
tonic = "0.14.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tonic-health = "0.14.2"
tonic-reflection = "0.14.2"
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
futures = "0.3.31"
async-stream = "0.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde"] }
axum = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tower = "0.5.2"
dotenv = "0.15.0"
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.22.1" # 连接池
bcrypt = "0.18.0" # 异步支持

validator = { workspace = true, features = ["derive"] }

# API Documentation
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
utoipa-axum = { version = "0.2.0" }
utoipa-redoc = { version = "6.0.0", features = ["axum"] }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

common = { path = "../../crates/common" }
async-trait = "0.1.89"
config = "0.15.19"
serde_yaml = "0.9.34"
toml = "0.9.11"
url = "2.5.8"
lapin = "3.7.2"
tracing-appender = "0.2.4"
jsonwebtoken = "10.3.0"
parking_lot = "0.12.5"
base64 = "0.22.1"
rand = "0.9.2"
once_cell = "1.21.3"
regex = "1.12.2"
validator-ext = {path = "../../crates/validator-ext"}
dashmap = "6.1.0"


[dev-dependencies]
tokio = { workspace = true, features = ["full", "rt-multi-thread", "macros"] }
