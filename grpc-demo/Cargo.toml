[workspace]
resolver = "2"

members = ["proto", "services/user-server", "clients/user-client", "crates/common"]

[workspace.dependencies]
tonic = "0.14.2"
tonic-prost = "0.14.2"
prost = "0.14.1"
prost-types = "0.14.1"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
tonic-build = "0.14.2"
prost-build = "0.14.1"
tonic-health = "0.14.2"
tonic-reflection = "0.14.2"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "migrate",
    "rust_decimal",
    "uuid"
] }
dotenv = "0.15.0"
axum = { version = "0.8.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0.17"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
