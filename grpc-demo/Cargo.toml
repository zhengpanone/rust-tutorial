[workspace]
resolver = "2"

members = ["proto", "services/user-server", "clients/user-client"]

[workspace.dependencies]
tonic = "0.14.1"
prost = "0.14.1"
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
tonic-build = "0.14.1"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "migrate",
    "rust_decimal"
] }



